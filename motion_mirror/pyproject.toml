[project]
name = "motion-mirror"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Iva5858", email = "isaacvelezaguirre@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.6.1",
    "imageio>=2.38.2",
    "imageio-ffmpeg>=0.8.1",
    "mediapipe>=1.2.3",
    "mujoco>=4.0.1",
    "numpy>=2.5.5",
    "opencv-python>=5.1.0.95",
    "torch>=2.15.0",
]

[project.scripts]
motion-mirror = "motion_mirror:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
